<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#0d1526"/>
      <stop offset="1" stop-color="#151022"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b8892b"/>
      <stop offset="0.5" stop-color="#f3d58a"/>
      <stop offset="1" stop-color="#b8892b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#d4a94a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#d4a94a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .t{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
      .ar{font-family:'Segoe UI','Noto Kufi Arabic','Geeza Pro',Tahoma,sans-serif}
      .line{stroke-dasharray:1400;animation:draw 3.5s ease-out}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes draw{from{stroke-dashoffset:1400}to{stroke-dashoffset:0}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glow)"/>

  <!-- equity-curve motif -->
  <polyline class="line" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linejoin="round"
    points="640,270 690,252 730,262 770,228 810,236 850,198 890,208 930,170 970,182 1010,140 1050,150 1090,110 1140,92"/>
  <circle class="pulse" cx="1140" cy="92" r="6" fill="#f3d58a"/>
  <g stroke="#d4a94a" stroke-opacity="0.35" stroke-width="1">
    <line x1="700" y1="232" x2="700" y2="270"/><line x1="780" y1="210" x2="780" y2="250"/>
    <line x1="860" y1="180" x2="860" y2="222"/><line x1="940" y1="150" x2="940" y2="196"/>
    <line x1="1020" y1="120" x2="1020" y2="166"/><line x1="1100" y1="90" x2="1100" y2="132"/>
  </g>

  <g>
    <text x="70" y="128" class="t" font-size="64" font-weight="700" letter-spacing="6" fill="url(#gold)">MNSUB</text>
    <rect x="72" y="146" width="120" height="3" fill="url(#gold)"/>
    <text x="70" y="196" class="t" font-size="24" fill="#e8ecf4" letter-spacing="1.5">Cloud Platforms · Algorithmic Trading · Automation</text>
  </g>
  <g>
    <text x="70" y="250" class="t" font-size="24" font-style="italic" fill="#c9cfdb">Built with precision. Proven by data.</text>
    <text x="70" y="296" class="t" font-size="16" fill="#7f8aa3" letter-spacing="3">SAUDI ARABIA  ·  STAFFLY.CC</text>
  </g>
</svg>
